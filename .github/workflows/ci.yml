name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The portable fallback: tests, doctests, lints, formatting.
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # A chip feature on a PC builds with the fallback.
      - run: cargo test --features esp32s31
      - run: cargo test --features esp32p4

  # The ESP32-S31 and ESP32-P4 share the xespv kernels and the target.
  xespv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chip: [esp32s31, esp32p4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imafc-unknown-none-elf, riscv32imac-unknown-none-elf
          components: clippy
      - run: cargo clippy --target riscv32imafc-unknown-none-elf --features ${{ matrix.chip }} -- -D warnings
      - run: cargo build --release --target riscv32imafc-unknown-none-elf --features ${{ matrix.chip }}
      # The feature on a RISC-V core without PIE (ESP32-C3/C6, P4 LP core) must not build.
      - run: "! cargo build --target riscv32imac-unknown-none-elf --features ${{ matrix.chip }}"
      # Two chip features at once must not build.
      - run: "! cargo build --target riscv32imafc-unknown-none-elf --features esp32s31,esp32p4"

  esp32s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32s3,esp32
          ldproxy: false
      - run: cargo build --release -Zbuild-std=core --target xtensa-esp32s3-none-elf --features esp32s3
      # The feature on an Xtensa chip without PIE (ESP32) must not build.
      - run: "! cargo build -Zbuild-std=core --target xtensa-esp32-none-elf --features esp32s3"

  # The raw xespv words in src/xespv.rs, checked against Espressif's
  # GNU assembler (ESP-IDF's RISC-V toolchain).
  xespv-words:
    runs-on: ubuntu-latest
    container: espressif/idf:latest
    steps:
      - uses: actions/checkout@v4
      - run: . "$IDF_PATH/export.sh" > /dev/null && tools/check-xespv-words.sh
        shell: bash
